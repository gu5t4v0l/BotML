<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/public/css/style.css">
<title>GL Bot — Painel</title>
</head>
<body>
  <main>
    <div class="header">
      <div class="header-left">
        <h1>ML Bot — Painel</h1>
        <p>Cadastre produtos para envio automático</p>
      </div>
      <div class="status-badge">
        <span class="pulse"></span>
        Bot ativo
      </div>
    </div>
 
    <div id="toast" class="toast"></div>
 
    <div class="card">
      <p class="card-title">Novo produto</p>
      <div class="form-grid">
        <div class="field">
          <label>Nome do produto</label>
          <input type="text" id="nome" placeholder="Ex: Fone Bluetooth JBL" maxlength="50" autocomplete="off">
        </div>
        <div class="field">
          <label>Preço</label>
          <input type="text" id="preco" placeholder="R$ 0,00" autocomplete="off">
        </div>
        <div class="field field-full">
          <label>URL da imagem</label>
          <input type="text" id="url_image" placeholder="https://..." autocomplete="off">
        </div>
        <div class="field field-full">
          <label>Link de afiliado</label>
          <input type="text" id="link" placeholder="https://mercadolivre.com.br/..." autocomplete="off">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="cadastrarProduto()">
          <i class="ti ti-plus" aria-hidden="true"></i>
          <span id="btn-cadastrar-label">Cadastrar produto</span>
          <div class="loading" id="loading-cadastrar"></div>
        </button>
        <button class="btn btn-secondary" onclick="limparForm()">
          Limpar
        </button>
      </div>
    </div>
 
    <div class="card">
      <div class="products-header">
        <p class="card-title">Produtos cadastrados</p>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="count-badge" id="count-badge">—</span>
          <button class="btn btn-secondary btn-sm" onclick="buscarProdutos()">
            <i class="ti ti-refresh" aria-hidden="true"></i>
            Atualizar
          </button>
        </div>
      </div>
      <div class="search-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="busca" class="search-input" placeholder="Pesquisar produto..." autocomplete="off" oninput="filtrarProdutos()">
      </div>
      <div class="product-list" id="lista-produtos">
        <div class="empty">Clique em "Atualizar" para carregar os produtos</div>
      </div>
    </div>
  </main>

  <script src="/js/Summit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</body>
</html>
